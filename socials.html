    <main class="page-content">
<div class="ytc-carousel">
  <div class="ytc-slides" id="ytc-slides">
    <div class="ytc-slide">
      <a href="https://www.youtube.com/@consrant" target="_blank">
        <img src="icons/youtube.png" alt="youtube">
      </a>
    </div>
    <div class="ytc-slide">
            <a href="https://twitch.tv/consrant581" target="_blank">
        <img src="icons/twitch.png" alt="twitch">
      </a>
    </div>
    <div class="ytc-slide">
           <a href="https://www.instagram.com/consrant1" target="_blank">
        <img src="icons/insta.png" alt="instagram">
      </a>
    </div>
  </div>

  <button class="ytc-btn" id="ytc-prev">&#10094;</button>
  <button class="ytc-btn" id="ytc-next">&#10095;</button>
</div>

<style>
  .ytc-carousel {
    width: 80vw;
    max-width: 1200px;
    height: 60vh;
    margin: auto;
    overflow: hidden;
    position: relative;
    border-radius: 12px;
  }

  .ytc-slides {
    display: flex;
    height: 100%;
    transition: transform 0.6s ease;
  }

  .ytc-slide {
    min-width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }

  .ytc-slide img {
    width: 70%;
    height: auto;
    animation: ytc-pop 1.2s ease;
    cursor: pointer;
  }

  @keyframes ytc-pop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .ytc-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.7);
    border: none;
    padding: 15px;
    cursor: pointer;
    font-size: 24px;
    border-radius: 50%;
    z-index: 10;
  }

  #ytc-prev { left: 10px; }
  #ytc-next { right: 10px; }
</style>

<script>
  let ytcIndex = 0;
  const ytcSlides = document.getElementById("ytc-slides");
  const ytcTotal = document.querySelectorAll(".ytc-slide").length;

  document.getElementById("ytc-next").onclick = () => {
    ytcIndex = (ytcIndex + 1) % ytcTotal;
    ytcSlides.style.transform = `translateX(-${ytcIndex * 100}%)`;
  };

  document.getElementById("ytc-prev").onclick = () => {
    ytcIndex = (ytcIndex - 1 + ytcTotal) % ytcTotal;
    ytcSlides.style.transform = `translateX(-${ytcIndex * 100}%)`;
  };
</script>


    </main>
